name: rung-4-sarif-upload

# Round-code-1 deliverable (2026-05-12): uploads the rung-4 LagrangeBench
# harness SARIFs to GitHub's Security tab, closing the rung-4b writeup §6
# item 3 forward-flag ("Full Security-tab integration screenshots and
# PR-comment integration are deferred to a separate deliverable").
#
# Source SARIFs are committed artifacts under
# external_validation/_rollout_anchors/01-lagrangebench/outputs/sarif/,
# produced by the rung-4 series's emit_sarif scripts. This workflow is
# upload-only — no compute, no rollout regeneration.
#
# Level distribution (post-round-code-1 band-to-level mapping in
# _harness/lint_eps_dir.py):
#   - rung-4a conservation SARIFs (segnn/gns_tgv2d_96ce8ed0eb): 60 note each
#     (mass_conservation_defect=0.0 PASS; energy_drift SKIP D0-18;
#      dissipation_sign_violation=0.0 PASS) — no findings to populate the
#      Security tab meaningfully, per the rung-4a writeup §3.2 self-assessment.
#   - rung-4b equivariance SARIFs (segnn/gns_tgv2d_eps_aeb4a53e87):
#       segnn: 140 note  (exact E(2)-equivariance; all PASS at the float32 floor)
#       gns:   60 note + 37 warning + 43 error  (bimodal — APPROXIMATE lower
#              mode + FAIL upper mode; this is the warning + error rendering
#              path the rung-4b writeup §6 item 3 named, now actually emitted)
#   - rung-4c conservation SARIFs (segnn/gns_dam2d_96ce8ed0eb): 36 note each
#     (mass=0.0 PASS; energy_drift SKIP D0-22a1; dissipation_sign_violation
#      SKIP D0-22) — all-PASS-equivalent, same Security-tab status as 4a.
#
# Each result carries a physical location (the committed harness adapter
# module that implements the rule, placeholder region) so GitHub Code
# Scanning resolves and displays it — logical-only locations are rejected /
# not displayed — plus a logical location with the per-row detail and a
# stable partialFingerprint so results sharing an adapter:1 physical location
# are not collapsed into one alert. See sarif_emitter.py and the round-code-1
# absorption writeup.
#
# Per the physics-lint.yml dogfood-workflow convention, each SARIF uploads
# with a distinct `category` so code-scanning analyses do not collapse
# (object-valued matrix entries serialise environment.model to "", which
# overwrites cross-shard alerts — see physics-lint.yml's matrix comment).

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  upload-rung-4-sarif:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 6 jobs all `uses: github/codeql-action/upload-sarif` → 6 simultaneous
      # downloads of the same action archive → codeload CDN 429s some of them
      # (observed on the first round-code-1 Path A run). Cap parallelism so the
      # archive download is staggered; this is upload-only (~20s/job) so 3 waves
      # of 2 is fine.
      max-parallel: 2
      matrix:
        include:
          - category: rung-4a-conservation-segnn-tgv2d
            sarif: external_validation/_rollout_anchors/01-lagrangebench/outputs/sarif/segnn_tgv2d_96ce8ed0eb.sarif
          - category: rung-4a-conservation-gns-tgv2d
            sarif: external_validation/_rollout_anchors/01-lagrangebench/outputs/sarif/gns_tgv2d_96ce8ed0eb.sarif
          - category: rung-4b-equivariance-segnn-tgv2d
            sarif: external_validation/_rollout_anchors/01-lagrangebench/outputs/sarif/segnn_tgv2d_eps_aeb4a53e87.sarif
          - category: rung-4b-equivariance-gns-tgv2d
            sarif: external_validation/_rollout_anchors/01-lagrangebench/outputs/sarif/gns_tgv2d_eps_aeb4a53e87.sarif
          - category: rung-4c-conservation-segnn-dam2d
            sarif: external_validation/_rollout_anchors/01-lagrangebench/outputs/sarif/segnn_dam2d_96ce8ed0eb.sarif
          - category: rung-4c-conservation-gns-dam2d
            sarif: external_validation/_rollout_anchors/01-lagrangebench/outputs/sarif/gns_dam2d_96ce8ed0eb.sarif
    steps:
      - uses: actions/checkout@v4
      - name: Upload ${{ matrix.category }} SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.sarif }}
          category: ${{ matrix.category }}
