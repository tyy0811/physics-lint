name: docs

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'docs/sphinx/**'
      - '.github/workflows/docs.yml'
      - 'external_validation/**/README.md'
      - 'STABILITY.md'
      - 'README.md'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install physics-lint with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Build sphinx
        run: sphinx-build docs/sphinx docs/sphinx/_build/html

      - name: Verify fail-loudly contract
        run: |
          # Temporarily delete one canonical section; expect build to fail.
          # Note: bash's default `set -e` is fine here, but we want to
          # KEEP RUNNING on the probe sphinx-build's non-zero exit so we
          # can inspect the log and restore the file. We turn `-e` off
          # for the probe call only, capture the exit code explicitly,
          # then turn `-e` back on.
          cp external_validation/PH-CON-003/README.md /tmp/PH-CON-003-README.md.bak
          sed -i '/^## Rule reference$/d' external_validation/PH-CON-003/README.md

          set +e
          sphinx-build docs/sphinx docs/sphinx/_build/probe-html > /tmp/probe.log 2>&1
          BUILD_EXIT=$?
          set -e

          # Always restore the file, even if downstream assertions fail.
          cp /tmp/PH-CON-003-README.md.bak external_validation/PH-CON-003/README.md

          if [ "$BUILD_EXIT" -eq 0 ]; then
            echo "FAIL: docs build did not fail when canonical section was missing"
            tail -40 /tmp/probe.log
            exit 1
          fi

          if ! grep -q "missing canonical section" /tmp/probe.log; then
            echo "FAIL: build failed for a different reason than missing canonical section"
            tail -40 /tmp/probe.log
            exit 1
          fi

          echo "PASS: fail-loudly contract verified (sphinx-build exited $BUILD_EXIT with the expected error)"

      - name: Configure Pages (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphinx/_build/html

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
