name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install physics-lint with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Build sphinx
        run: sphinx-build docs/sphinx docs/sphinx/_build/html

      - name: Verify fail-loudly contract
        run: |
          # Temporarily delete one canonical section; expect build to fail.
          cp external_validation/PH-CON-003/README.md /tmp/PH-CON-003-README.md.bak
          sed -i '/^## Rule reference$/d' external_validation/PH-CON-003/README.md
          if sphinx-build docs/sphinx docs/sphinx/_build/probe-html 2>&1 | tee /tmp/probe.log; then
            echo "FAIL: docs build did not fail when canonical section was missing"
            cp /tmp/PH-CON-003-README.md.bak external_validation/PH-CON-003/README.md
            exit 1
          fi
          grep -q "missing canonical section" /tmp/probe.log || {
            echo "FAIL: build failed for a different reason than missing canonical section"
            cp /tmp/PH-CON-003-README.md.bak external_validation/PH-CON-003/README.md
            exit 1
          }
          cp /tmp/PH-CON-003-README.md.bak external_validation/PH-CON-003/README.md
          echo "PASS: fail-loudly contract verified"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphinx/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
