[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "physics-lint"
version = "1.0.0"
description = "Linter for trained neural PDE surrogates"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Jane Yeung", email = "tyjaneyeung@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    # Upper-bounded: torch stopped publishing x86-64 macOS wheels after
    # 2.2.2, which was built against the NumPy 1.x ABI. Without <2, a
    # macOS-Intel `pip install` resolves numpy 2.x + torch 2.2.2 and
    # adapter-mode (CallableField) crashes on the torch->numpy bridge.
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "torch>=2.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "tomli>=2.0; python_version<'3.11'",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "pde", "neural-surrogate", "linter", "ci", "sarif",
    "scientific-machine-learning", "physics-informed",
]

[project.optional-dependencies]
mesh = ["scikit-fem>=10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "h5py>=3.10",  # rung 4b T7 harness modules (synthetic_dataset_materializer, read_published_input_windows) + their tests
    "ruff>=0.5",
    "codespell>=2.2",
    "pre-commit>=3.5",
    "sphinx>=7.0",
    "myst-parser>=3.0",
    "furo>=2024.5",
]

[project.scripts]
physics-lint = "physics_lint.cli:app"

[project.urls]
Homepage = "https://github.com/tyy0811/physics-lint"
Repository = "https://github.com/tyy0811/physics-lint"
Issues = "https://github.com/tyy0811/physics-lint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_lint"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "N802"]  # allow non-snake-case test names (test_PH_RES_001)
"src/physics_lint/cli/*" = ["B008", "UP045"]  # typer canonical pattern uses typer.Argument/Option in defaults and Optional[X]

[tool.ruff.lint.isort]
known-first-party = ["physics_lint"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --hypothesis-show-statistics"

[tool.coverage.run]
source = ["physics_lint"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.codespell]
skip = "*.lock,*.pyc,.git,dist,build,*.egg-info,docs/_build,src/physics_lint/data/floors.toml"
ignore-words-list = "bochner,fosls,riesz,sobolev,dirichlet,neumann,laplace,poisson,helmholtz,ernst,fornberg,trefethen,jekel,hansen,gruver,brandstetter,virkkunen,bachmayr,dahmen,oster,qiu,kovachki,welling,worrall,helwig,ot,cfm,ddpm,dps,fno,pinn,pino,pde,pdes,nd,ue,nin,oint,numer"
